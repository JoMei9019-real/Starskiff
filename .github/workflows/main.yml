name: Build Starskiff

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Starskiff
        uses: actions/checkout@v4

      - name: Build Starskiff
        run: |
          xcodebuild \
            -project Starskiff.xcodeproj \
            -scheme Starskiff \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package DMG
        run: |
          DMG_NAME="Starskiff-${GITHUB_SHA::7}.dmg" bash scripts/build-dmg.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Starskiff-${{ github.sha }}
          path: Artifacts/Starskiff-*.dmg
          if-no-files-found: error
          retention-days: 14
